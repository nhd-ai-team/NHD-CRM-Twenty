name: twenty

services:
  server:
    image: twentycrm/twenty:${TAG:-latest}
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    # 不直接暴露，由 twenty-portal nginx 代理（保持 localhost:3000 入口不变）
    environment:
      NODE_PORT: 3000
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD:-postgres}@${PG_DATABASE_HOST:-db}:${PG_DATABASE_PORT:-5432}/default
      SERVER_URL: ${SERVER_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DISABLE_DB_MIGRATIONS: ${DISABLE_DB_MIGRATIONS}
      DISABLE_CRON_JOBS_REGISTRATION: ${DISABLE_CRON_JOBS_REGISTRATION}

      STORAGE_TYPE: ${STORAGE_TYPE}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION}
      STORAGE_S3_NAME: ${STORAGE_S3_NAME}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT}

      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY}
      APP_SECRET: ${APP_SECRET:-}

      # 出站邮件（工作区邀请、忘记密码等）。默认 QQ 邮箱 SMTP；
      # 账号/授权码等敏感值只从 .env 读取，仓库不留明文。
      EMAIL_DRIVER: ${EMAIL_DRIVER:-smtp}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-smtp.qq.com}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-465}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-新宏大 CRM}
      EMAIL_SYSTEM_ADDRESS: ${EMAIL_SYSTEM_ADDRESS}

      HTTP_PROXY: http://host.docker.internal:7890
      HTTPS_PROXY: http://host.docker.internal:7890
      NO_PROXY: localhost,127.0.0.1,db,redis,server,worker,middleware
      NODE_USE_ENV_PROXY: "1"

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:3000/healthz
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always

  worker:
    image: twentycrm/twenty:${TAG:-latest}
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    command: ["yarn", "worker:prod"]
    environment:
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD:-postgres}@${PG_DATABASE_HOST:-db}:${PG_DATABASE_PORT:-5432}/default
      SERVER_URL: ${SERVER_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"

      STORAGE_TYPE: ${STORAGE_TYPE}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION}
      STORAGE_S3_NAME: ${STORAGE_S3_NAME}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT}

      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY}
      APP_SECRET: ${APP_SECRET:-}

      # 出站邮件（邀请/忘记密码等）。worker 负责发信任务，与 server 保持一致配置。
      EMAIL_DRIVER: ${EMAIL_DRIVER:-smtp}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-smtp.qq.com}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-465}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-新宏大 CRM}
      EMAIL_SYSTEM_ADDRESS: ${EMAIL_SYSTEM_ADDRESS}

      HTTP_PROXY: http://host.docker.internal:7890
      HTTPS_PROXY: http://host.docker.internal:7890
      NO_PROXY: localhost,127.0.0.1,db,redis,server,worker,middleware
      NODE_USE_ENV_PROXY: "1"

    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: always

  db:
    image: postgres:16
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${PG_DATABASE_NAME:-default}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD:-postgres}
      POSTGRES_USER: ${PG_DATABASE_USER:-postgres}
    healthcheck:
      test: pg_isready -U ${PG_DATABASE_USER:-postgres} -h localhost -d postgres
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  redis:
    image: redis
    restart: always
    command: ["--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Twenty 门户（反向代理，接管 3000 端口）──────────────────────────────
  twenty-portal:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx/twenty-portal.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/inject:/etc/nginx/inject:ro
    depends_on:
      - server
    restart: always

  # ── 对话工作台前端（生产静态构建）──────────────────────────────────────────
  chat-ui:
    container_name: twenty-chat-ui
    build:
      context: ./chat-ui
      dockerfile: Dockerfile
    restart: always

  # ── 中间层同步服务 ────────────────────────────────────────────────────────
  middleware:
    build: ./middleware
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      TWENTY_API_URL: http://server:3000
      TWENTY_API_KEY: ${TWENTY_API_KEY:-}
      WEBHOOK_SECRET: ${MIDDLEWARE_WEBHOOK_SECRET}
      DATABASE_URL: postgresql://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD:-postgres}@db:5432/${PG_DATABASE_NAME:-default}
      WAHA_API_URL: http://waha:3000
      WAHA_API_KEY: ${EVOLUTION_API_KEY}
      WAHA_SESSION: default
      WAHA_WEBHOOK_URL: http://middleware:3002/api/whatsapp/webhook
      AI_SERVICE_URL: http://ai-service:8790
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY}
      AI_SERVICE_TENANT_ID: ${AI_SERVICE_TENANT_ID:-nhd}
      # 官网入站 webhook 校验密钥（与 ai-service 的 CRM_WEBHOOK_SECRET 一致）
      WEBSITE_INGEST_SECRET: ${WEBSITE_INGEST_SECRET:-}
      # 邮箱 IMAP 只读收取（沉淀到对话工作台 email 渠道，不回复）
      IMAP_HOST: ${IMAP_HOST:-imap.qiye.163.com}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_TLS: ${IMAP_TLS:-true}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_MAILBOX: ${IMAP_MAILBOX:-INBOX}
      IMAP_POLL_SECONDS: ${IMAP_POLL_SECONDS:-60}
      IMAP_INITIAL_FETCH_LIMIT: ${IMAP_INITIAL_FETCH_LIMIT:-20}
      # 调 ai-service /api/agent 的 Basic Auth（销售在 CRM 回复官网访客）
      AI_AGENT_USER: ${AI_AGENT_USER:-admin}
      AI_AGENT_PASSWORD: ${AI_AGENT_PASSWORD:-admin123}
      GRAPH_API_VERSION: ${GRAPH_API_VERSION:-v21.0}
      INSTAGRAM_VERIFY_TOKEN: ${INSTAGRAM_VERIFY_TOKEN:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      INSTAGRAM_PAGE_ACCESS_TOKEN: ${INSTAGRAM_PAGE_ACCESS_TOKEN:-}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN:-}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${FACEBOOK_PAGE_ACCESS_TOKEN:-}
      CONVERSATION_UPLOAD_DIR: /app/uploads/conversation-files
      CONVERSATION_MAX_UPLOAD_MB: ${CONVERSATION_MAX_UPLOAD_MB:-25}
    volumes:
      - middleware-uploads:/app/uploads
    depends_on:
      - server
    restart: always

  # ── Evolution API（WhatsApp 个人号接入）────────────────────────────────────
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: ${SERVER_URL}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD:-postgres}@db:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution_client
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      DEL_INSTANCE: "false"
      LANGUAGE: zh-CN
      CONFIG_SESSION_PHONE_VERSION: "2.3000.1023204200"
      HTTP_PROXY: http://host.docker.internal:7890
      HTTPS_PROXY: http://host.docker.internal:7890
      # Docker 内部服务不能经过本机代理，否则 webhook 会被代理拒绝（502）。
      NO_PROXY: localhost,127.0.0.1,db,redis,middleware,evolution-api
      PROXY_HOST: host.docker.internal
      PROXY_PORT: "7890"
      PROXY_PROTOCOL: http
      WEBHOOK_GLOBAL_URL: http://middleware:3002/api/whatsapp/webhook
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
    volumes:
      - evolution-instances:/evolution/instances
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  # ── WAHA（WhatsApp HTTP API，真实 Chrome + WhatsApp 网页版）─────────────────
  waha:
    image: devlikeapro/waha:arm
    ports:
      - "3003:3000"
    environment:
      WAHA_API_KEY: ${EVOLUTION_API_KEY}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WHATSAPP_DEFAULT_ENGINE: WEBJS
      WAHA_PRINT_QR: "false"
      WHATSAPP_HOOK_URL: http://middleware:3002/api/whatsapp/webhook
      WHATSAPP_HOOK_EVENTS: message.any
      HTTP_PROXY: http://host.docker.internal:7890
      HTTPS_PROXY: http://host.docker.internal:7890
      NO_PROXY: localhost,127.0.0.1,db,redis,middleware
    volumes:
      - waha-sessions:/app/.sessions
    restart: always

  # ── AI 客服服务（知识库 + AI 回复能力层）──────────────────────────────────
  ai-service:
    build:
      context: ../../../测试/ai-customer-service-system
    # 发布到宿主机回环，供 Cloudflare 隧道 aichatbot.chinanhd.com → 127.0.0.1:8790 接入。
    ports:
      - "127.0.0.1:8790:8790"
    environment:
      APP_ENV: development
      PORT: "8790"
      HOST: 0.0.0.0
      DATABASE_PATH: /app/data/customer_service.sqlite3
      KNOWLEDGE_ENGINE: local
      REQUIRE_INTEGRATION_AUTH: "true"
      INTEGRATION_API_KEY: ${AI_SERVICE_API_KEY}
      INTEGRATION_CLIENT_ID: nhd-crm-middleware
      INTEGRATION_TENANT_ID: ${AI_SERVICE_TENANT_ID:-nhd}
      # 由部署命令从 Mac ~/.hermes/.env 读取；不写入 CRM 仓库。
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_API_BASE: http://host.docker.internal:8787/api/v1
      OPENROUTER_MODEL: openai/gpt-oss-120b
      OPENROUTER_TIMEOUT_MS: "20000"
      # 官网 widget 嵌入 chinanhd.com；aichatbot 为预览页自身来源
      ALLOWED_ORIGINS: https://chinanhd.com,https://www.chinanhd.com,https://aichatbot.chinanhd.com,https://staging.chinanhd.com,http://staging.chinanhd.com
      # 官网访客消息转发到 CRM 会话工作台
      CRM_WEBHOOK_URL: http://middleware:3002/api/website/webhook
      CRM_WEBHOOK_SECRET: ${WEBSITE_INGEST_SECRET}
    volumes:
      - ai-service-data:/app/data
    restart: always

volumes:
  db-data:
  server-local-data:
  evolution-instances:
  waha-sessions:
  ai-service-data:
  middleware-uploads:
