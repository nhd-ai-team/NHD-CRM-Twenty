worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    map "$http_authorization:$cookie_tokenPair" $metadata_no_auth {
        default 0;
        ":" 1;
    }

    # Metadata is authenticated and workspace-specific. The short TTL avoids
    # stale schema after a field change while proxy_cache_lock coalesces
    # concurrent first-load requests for the same user/query.
    proxy_cache_path /var/cache/nginx/metadata
        levels=1:2
        keys_zone=metadata_cache:16m
        max_size=128m
        inactive=30s
        use_temp_path=off;

    include /etc/nginx/conf.d/*.conf;
}
