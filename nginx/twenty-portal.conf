server {
    listen 80;
    absolute_redirect off;

    location = /chat-nav.js {
        alias /etc/nginx/inject/chat-nav.js;
        add_header Content-Type "application/javascript; charset=utf-8";
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /settings-nav-lite.js {
        alias /etc/nginx/inject/settings-nav-lite.js;
        add_header Content-Type "application/javascript; charset=utf-8";
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /settings-channels-panel.js {
        alias /etc/nginx/inject/settings-channels-panel.js;
        add_header Content-Type "application/javascript; charset=utf-8";
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /twenty-auth-capture.js {
        alias /etc/nginx/inject/twenty-auth-capture.js;
        add_header Content-Type "application/javascript; charset=utf-8";
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /crm-cache-reset {
        add_header Clear-Site-Data "\"cache\"" always;
        add_header Cache-Control "no-store" always;
        return 204;
    }

    location /ws {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /chat/ {
        proxy_pass http://twenty-chat-ui:3003/chat/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-cache" always;
    }

    location /conv-api/ {
        proxy_pass http://middleware:3002/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    # 兼容官网表单旧路径：网站若直接 POST /api/website/* 也能正确转发到 middleware。
    location /api/website/ {
        proxy_pass http://middleware:3002/api/website/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    location = /graphql {
        proxy_pass http://middleware:3002/api/graphql-compat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    location /assets/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Vite builds Twenty assets with content hashes. Let browsers and
        # Cloudflare cache these immutable modules so settings pages do not
        # have to pull hundreds of JS chunks through the tunnel on every load.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 1y;
    }

    location = /settings/accounts/channels {
        return 302 /settings/profile#channels;
    }

    location = /settings/profile {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        sub_filter '<head>' '<head><script src="/twenty-auth-capture.js?v=20260813-auth-capture-v1"></script>';
        sub_filter '</body>' '<script src="/settings-nav-lite.js?v=20260813-lite-panel-v5"></script></body>';
        sub_filter_once off;
        sub_filter_types text/html;
        proxy_set_header Accept-Encoding "";
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    location / {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        sub_filter '<head>' '<head><script src="/twenty-auth-capture.js?v=20260813-auth-capture-v1"></script>';
        sub_filter '</body>' '<script src="/chat-nav.js?v=20260824-nav-order-v1"></script></body>';
        sub_filter_once off;
        sub_filter_types text/html;
        proxy_set_header Accept-Encoding "";
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }
}

#
