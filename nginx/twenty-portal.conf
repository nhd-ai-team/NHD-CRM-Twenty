server {
    listen 80;

    # 侧边栏注入脚本
    location = /chat-nav.js {
        alias /etc/nginx/inject/chat-nav.js;
        add_header Content-Type "application/javascript; charset=utf-8";
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 一次性清除当前浏览器对 CRM 域名的资源缓存，不清 Cookie 或登录状态。
    location = /crm-cache-reset {
        add_header Clear-Site-Data "\"cache\"" always;
        add_header Cache-Control "no-store" always;
        return 204;
    }

    # WebSocket 支持（Twenty 用到）
    location /ws {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # ── 对话工作台 (/chat/) ────────────────────────────────────────────────
    # 主应用
    location /chat/ {
        proxy_pass http://chat-ui:3003/chat/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-cache" always;
    }

    # 对话工作台后端 API；页面通过同域路径访问，避免浏览器跨域限制
    location /conv-api/ {
        proxy_pass http://middleware:3002/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 实时会话数据不可被 Cloudflare/浏览器缓存，否则销售看到过期列表
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    # Twenty 前端使用按 hash 分包的 ES module。Cloudflare 或浏览器缓存旧 HTML 时，
    # 可能继续请求已失效的 /assets/*.js，返回 SPA HTML 后触发 MIME type 错误。
    # 这里强制前端静态资源不走缓存，先保证登录和欢迎页稳定。
    location /assets/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    # 代理 Twenty（兜底，必须在 /chat/ 之后）
    # sub_filter 向 index.html 注入侧边栏脚本
    location / {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 仅恢复稳定的对话工作台入口；中文菜单转换逻辑仍保持关闭。
        # 通过版本参数绕过浏览器中曾缓存的旧菜单脚本。
        sub_filter '</body>' '<script src="/chat-nav.js?v=20260805-2"></script></body>';
        sub_filter_once on;
        sub_filter_types text/html;
        proxy_set_header Accept-Encoding "";
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }
}
